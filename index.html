<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triângulo Entretenimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Strichpunkt+Sans:wdth,wght@75,400;75,500;75,700;100,300;100,400;100,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #000;
      background-image: radial-gradient(circle, #0f0f0f 1px, transparent 1px);
      background-size: 3px 3px;
      color: #fff;
      font-family: 'Strichpunkt Sans', 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 10px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px 20px 60px;
    }

    .logo {
      max-width: 380px;
      width: 90%;
      height: auto;
    }

    .site-status {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      margin-top: -24px;
    }

    .contatos {
      display: flex;
      flex-direction: row;
      gap: 0;
      justify-content: center;
      align-items: stretch;
      width: 100%;
      max-width: 600px;
    }

    .contato {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      padding: 20px 16px;
    }

    .contato-icon {
      width: 32px;
      height: 32px;
      fill: #444;
      transition: fill 0.2s;
      flex-shrink: 0;
    }

    .contato:hover .contato-icon {
      fill: #ed1b24;
    }

    .contato-label {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #666;
      text-align: center;
      white-space: nowrap;
    }

    .contato-numero {
      font-size: 1.35rem;
      font-weight: 400;
      color: #fff;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .contato:hover .contato-numero {
      color: #ed1b24;
    }

    .divisor {
      width: 1px;
      background: #222;
      align-self: stretch;
      margin: 8px 0;
    }

    @media (max-width: 480px) {
      .contatos {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .divisor {
        width: 40px;
        height: 1px;
        margin: 0;
        align-self: center;
      }

      .contato-numero {
        font-size: 1.2rem;
      }
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 14px 20px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 300;
      color: #666;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-bottom: 15px solid #ed1b24;
    }
  </style>
</head>
